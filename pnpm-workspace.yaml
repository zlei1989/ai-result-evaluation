packages:
  - apps/*
  - packages/server/*
  - packages/client/*

# pnpm 11 要求对依赖的安装脚本逐个表态。sharp（Next 图像优化）与 unrs-resolver
# （eslint-plugin-import-x 的原生解析器）都放行，否则 install 以 ERR_PNPM_IGNORED_BUILDS 退出 1。
# 注意：pnpm 11 下把它们写进 onlyBuiltDependencies **不再生效**（实测仍报同一错误），必须用 allowBuilds。
allowBuilds:
  # 以下五项是 2026-09-25 装三家厂商 SDK（dsh 走 next 线 0.1.7-rc.1）时 pnpm 点名要求表态的
  # 传递依赖：pnpm 自己写入了占位值 "set this to true or false" 并以 ERR_PNPM_IGNORED_BUILDS 退出 1，
  # 这里按计划 Task 2 Step 3 的规则逐个置 true 以完成落位。它们都不是本仓的直接依赖。
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  # esbuild 是 vitest 的原生引擎（直接依赖）。2026-10-09 装 vitepress 时 pnpm 又把占位值
  # 写回这里并退出 1——onlyBuiltDependencies 在 pnpm 11 下不生效（上方第 8 行注释的同一件事），
  # 必须在这里显式置 true。
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild

# pnpm 11 默认开启「发布年龄闸」（`minimumReleaseAge`，24 小时）：命中即
# `ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION`，`--frozen-lockfile` 也会拒装。
# 子智能体扩展按批准的版本 pin 在 0.21.0，发布时间落在窗口内 ⇒ 按包名+版本豁免；
# 豁免是逐条的，不放开整条策略。
minimumReleaseAgeExclude:
  - '@tintinweb/pi-subagents@0.21.0'
  # pi 1.3.0 族与 codex 0.163.0 的发布时间落在 24 h 窗口内，`pnpm install` 命中该闸并把条目
  # 写在这里 ⇒ 逐条豁免。codex 那条是六个平台包与 CLI 包的 or 表达式：平台包是 CLI 包的
  # npm 别名，版本必须同进同退，只豁免其中一个会让原生二进制与启动器版本错位。
  - '@earendil-works/pi-agent-core@1.3.0'
  - '@earendil-works/pi-ai@1.3.0'
  - '@earendil-works/pi-codemode@1.3.0'
  - '@earendil-works/pi-coding-agent@1.3.0'
  - '@earendil-works/pi-mcp@1.3.0'
  - '@earendil-works/pi-telemetry@1.3.0'
  - '@earendil-works/pi-tui@1.3.0'
  - '@openai/codex@0.163.0-darwin-arm64 || 0.163.0-darwin-x64 || 0.163.0-linux-arm64 || 0.163.0-linux-x64 || 0.163.0-win32-arm64 || 0.163.0-win32-x64 || 0.163.0'

# streamdown 依赖 tailwind-merge 做类名合并，而本仓的 `cn` 就是它的替代（clsx + tailwind-merge，
# 零传递依赖）。把这一条按包名+依赖者别名掉，避免为一条 `twMerge` 再进一棵 tailwind-merge；
# `clsx` 不别名——它在树里早已存在（2.1.1，多个既有包共用），不构成重复安装。
overrides:
  streamdown>tailwind-merge: npm:cn@0.5.0
